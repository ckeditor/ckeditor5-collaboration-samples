packages:
  - "*/"
  - "!_*/"
  - "!.*/"
  - "!build/"
  - "!node_modules/"

allowBuilds:
  esbuild: true
  lmdb: false
  msgpackr-extract: false
  protobufjs: true
  sharp: true
  snyk: true
  unrs-resolver: true

overrides:
  'glob@^13': '^14.0.3'
  'minimatch@^10': '^11.0.3'
  'sass>@parcel/watcher': '-'

minimumReleaseAge: 4320 # 3 days
minimumReleaseAgeExclude:
  - '@ckeditor/*'
  - '@cksource/*'
  - '*ckeditor5*'

shellEmulator: true
shamefullyHoist: true
preferFrozenLockfile: true
autoDedupe: true
linkWorkspacePackages: true
ignoreWorkspaceCycles: true
verifyDepsBeforeRun: false

packages:
  - "*/"
  - "!_*/"
  - "!.*/"
  - "!build/"
  - "!node_modules/"

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  lmdb: false
  msgpackr-extract: false
  protobufjs: true
  sharp: true
  snyk: true
  unrs-resolver: true

overrides:
  'postcss@^8': '^8.5.18'
  'sharp@^0.34': '^0.35.0'
  'tar@^6': '^7.5.21'
  'uuid@^9': '^14.0.0'
  'ws@^8': '^8.21.1'
  'esbuild@^0.27': '^0.28.1'
  'esbuild@^0.28': '^0.28.1'
  'protobufjs@^7': '^7.6.4'
  '@babel/core@^7': '^7.29.7'
  'brace-expansion@^1': '^1.1.16'
  'brace-expansion@^2': '^2.1.2'
  'brace-expansion@^5': '^5.0.8'
  'immutable@^5': '^5.1.8'
  'js-yaml@^3': '^4.3.0'
  'fast-uri@^3': '^3.1.4'
  'tar@^7': '^7.5.21'

minimumReleaseAge: 4320 # 3 days
minimumReleaseAgeExclude:
  - '@ckeditor/*'
  - '@cksource/*'
  - '*ckeditor5*'

shellEmulator: true
shamefullyHoist: true
preferFrozenLockfile: true
linkWorkspacePackages: true
ignoreWorkspaceCycles: true
verifyDepsBeforeRun: false

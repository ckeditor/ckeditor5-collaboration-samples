packages:
  - "*/"
  - "!_*/"
  - "!.*/"
  - "!build/"
  - "!node_modules/"

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  lmdb: false
  msgpackr-extract: false
  protobufjs: true
  sharp: true
  snyk: true
  unrs-resolver: true

overrides:
  'postcss@^8': '^8.5.18'
  'sharp@^0.34': '^0.35.0'
  'esbuild@^0.27': '^0.28.1'
  'brace-expansion@^1': '^1.1.18'
  'brace-expansion@^2': '^2.1.4'
  'brace-expansion@^5': '^5.0.9'
  'browserslist@^4': '^4.28.7'
  'js-yaml@^3': '^4.3.1'
  'js-yaml@^4': '^4.3.1'
  'nanoid@^3': '^3.3.18'
  'nanoid@^5': '^5.1.16'
  'fast-uri@^3': '^3.1.6'
  # `@angular/cli` pins the SDK exactly at 1.26.0, which allows only `@hono/node-server@^1`.
  # 1.30.0 is the first release accepting `^2.0.5`, so bump it to let the newer server resolve.
  '@modelcontextprotocol/sdk@^1': '^1.30.0'
  # The SDK's range is `^1.19.9 || ^2.0.5`, so pin the newer line explicitly - otherwise pnpm keeps
  # the already-resolved 1.x. The SDK is its only consumer.
  '@hono/node-server': '^2.0.5'

minimumReleaseAge: 10080 # 7 days
blockExoticSubdeps: true
trustPolicy: no-downgrade
minimumReleaseAgeExclude:
  - '@ckeditor/*'
  - '@cksource/*'
  - '*ckeditor5*'
  # Needed for the `next` bump below - 16.3.3 is newer than the age gate.
  - 'next' # Remove after 2026-08-28.
  - '@next/*' # Remove after 2026-08-28.

shellEmulator: true
shamefullyHoist: true
preferFrozenLockfile: true
linkWorkspacePackages: true
ignoreWorkspaceCycles: true
verifyDepsBeforeRun: false

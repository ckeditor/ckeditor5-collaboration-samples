packages:
  - "*/"
  - "!_*/"
  - "!.*/"
  - "!build/"
  - "!node_modules/"

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  lmdb: false
  msgpackr-extract: false
  protobufjs: true
  sharp: true
  snyk: true
  unrs-resolver: true

overrides:
  'postcss@^8': '^8.5.18'
  'js-yaml@^3': '^4.3.1'
  # The `@modelcontextprotocol/sdk` (SDK) range is `^1.19.9 || ^2.0.5`, so pin the newer line explicitly -
  # otherwise pnpm keeps the already-resolved 1.x. The SDK is its only consumer.
  '@hono/node-server': '^2.0.5'

minimumReleaseAge: 4320 # 3 days
minimumReleaseAgeExclude:
  - '@ckeditor/*'
  - '@cksource/*'
  - '*ckeditor5*'

shellEmulator: true
shamefullyHoist: true
preferFrozenLockfile: true
autoDedupe: true
linkWorkspacePackages: true
ignoreWorkspaceCycles: true
verifyDepsBeforeRun: false

packages:
  - "*/"
  - "!_*/"
  - "!.*/"
  - "!build/"
  - "!node_modules/"

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  lmdb: false
  msgpackr-extract: false
  protobufjs: true
  sharp: true
  snyk: true
  unrs-resolver: true

overrides:
  'postcss@^8': '^8.5.18'
  'sharp@^0.34': '^0.35.0'
  'tar@^6': '^7.5.21'
  'uuid@^9': '^14.0.0'
  'ws@^8': '^8.21.1'
  'esbuild@^0.27': '^0.28.1'
  'esbuild@^0.28': '^0.28.1'
  'protobufjs@^7': '^7.6.4'
  '@babel/core@^7': '^7.29.7'
  'brace-expansion@^1': '^1.1.16'
  'brace-expansion@^2': '^2.1.2'
  'brace-expansion@^5': '^5.0.8'
  'immutable@^5': '^5.1.8'
  'js-yaml@^3': '^4.3.0'
  'fast-uri@^3': '^3.1.4'
  'tar@^7': '^7.5.21'
  # `@angular/cli` pins the SDK exactly at 1.26.0, which allows only `@hono/node-server@^1`.
  # 1.30.0 is the first release accepting `^2.0.5`, so bump it to let the newer server resolve.
  '@modelcontextprotocol/sdk@^1': '^1.30.0'
  # The SDK's range is `^1.19.9 || ^2.0.5`, so pin the newer line explicitly - otherwise pnpm keeps
  # the already-resolved 1.x. The SDK is its only consumer.
  '@hono/node-server': '^2.0.5'

minimumReleaseAge: 4320 # 3 days
minimumReleaseAgeExclude:
  - '@ckeditor/*'
  - '@cksource/*'
  - '*ckeditor5*'
  # Needed for the `@modelcontextprotocol/sdk` override above - 1.30.0 is newer than the age gate.
  - '@modelcontextprotocol/sdk'

shellEmulator: true
shamefullyHoist: true
preferFrozenLockfile: true
linkWorkspacePackages: true
ignoreWorkspaceCycles: true
verifyDepsBeforeRun: false
